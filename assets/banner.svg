<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark Background Canvas -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/>

  <!-- Dynamic Glowing Cyber Grid/Pills in Background (Behind Text) -->
  <g opacity="0.25">
    <circle cx="150" cy="80" r="180" fill="url(#glowGrad)"/>
    <circle cx="1050" cy="280" r="220" fill="url(#glowGrad)"/>
    
    <!-- Animated Pulsing Nodes -->
    <circle cx="200" cy="180" r="4" fill="#38bdf8">
      <animate attributeName="r" values="3;7;3" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="120" r="5" fill="#818cf8">
      <animate attributeName="r" values="4;9;4" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="240" r="4" fill="#c084fc">
      <animate attributeName="r" values="3;8;3" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Glowing Connecting Lines -->
    <path d="M 100 180 Q 200 120 350 180 T 600 180 T 850 140 T 1100 200" stroke="#6366f1" stroke-width="1.5" fill="none" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Foreground Content Group (Always Sharp & Unobscured) -->
  <g filter="url(#shadow)">
    <!-- Security Shield Icon Frame -->
    <g transform="translate(600, 75)">
      <!-- Outer Shield Path -->
      <path d="M 0 -45 L 35 -25 L 35 15 C 35 38 0 52 0 52 C 0 52 -35 38 -35 15 L -35 -25 Z" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2"/>
      <!-- Keyhole Symbol inside Shield -->
      <circle cx="0" cy="-5" r="7" fill="#ffffff"/>
      <polygon points="-4,-2 4,-2 6,18 -6,18" fill="#ffffff"/>
    </g>

    <!-- Main Title -->
    <text x="600" y="185" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="38" fill="url(#titleGrad)" letter-spacing="1">
      Awesome Customer Identity &amp; Access Management
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="230" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="20" fill="#94a3b8" letter-spacing="0.5">
      The Ultimate CIAM Ecosystem Guide: SaaS Platforms &amp; Open-Source Projects
    </text>

    <!-- Feature Tech Pills (Foreground) -->
    <g transform="translate(600, 280)">
      <!-- Pill 1: Auth & SSO -->
      <g transform="translate(-240, 0)">
        <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🔒 OAuth2 &amp; OIDC</text>
      </g>
      <!-- Pill 2: Multi-Tenancy -->
      <g transform="translate(-80, 0)">
        <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
        <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🏢 Multi-Tenancy</text>
      </g>
      <!-- Pill 3: Passkeys & MFA -->
      <g transform="translate(80, 0)">
        <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
        <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🔑 Passkeys &amp; MFA</text>
      </g>
      <!-- Pill 4: Open Source -->
      <g transform="translate(240, 0)">
        <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
        <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ Self-Hosted</text>
      </g>
    </g>
  </g>
</svg>
